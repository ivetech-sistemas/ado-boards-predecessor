<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Demonstração — Predecessores no card</title>
    <!--
      Reprodução SIMPLIFICADA do board/taskboard, só para as capturas do README.
      A estrutura do card segue o HTML real capturado no spike; estes estilos são aproximados.
      O bloco de predecessores usa o estilos.css real da extensão.
    -->
    <link rel="stylesheet" href="estilos.css" />
    <style>
      :root[data-tema='claro'] {
        --text-primary-color: rgba(0, 0, 0, 0.9);
        --text-secondary-color: rgba(0, 0, 0, 0.55);
        --border-subtle-color: rgba(0, 0, 0, 0.08);
        --focus-border-color: #0078d4;
        --fundo-pagina: #f8f8f8;
        --fundo-topo: #ffffff;
        --fundo-coluna: #f3f2f1;
        --fundo-card: #ffffff;
        --sombra-card: 0 1.6px 3.6px rgba(0, 0, 0, 0.13), 0 0.3px 0.9px rgba(0, 0, 0, 0.1);
        --tag: rgba(0, 0, 0, 0.06);
        --linha-tabela: rgba(0, 0, 0, 0.08);
      }
      :root[data-tema='escuro'] {
        --text-primary-color: rgba(255, 255, 255, 0.95);
        --text-secondary-color: rgba(255, 255, 255, 0.8);
        --border-subtle-color: rgba(255, 255, 255, 0.08);
        --focus-border-color: rgba(121, 181, 255, 1);
        --fundo-pagina: #1b1a19;
        --fundo-topo: #252423;
        --fundo-coluna: #201f1e;
        --fundo-card: #323130;
        --sombra-card: 0 1.6px 3.6px rgba(0, 0, 0, 0.5);
        --tag: rgba(255, 255, 255, 0.1);
        --linha-tabela: rgba(255, 255, 255, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font: 14px/20px 'Segoe UI', 'Segoe UI Web', system-ui, sans-serif;
        color: var(--text-primary-color);
        background: var(--fundo-pagina);
        overflow: hidden;
      }
      .topo {
        display: flex;
        align-items: baseline;
        gap: 20px;
        padding: 14px 24px 0;
        background: var(--fundo-topo);
        border-bottom: 1px solid var(--border-subtle-color);
      }
      .topo-titulo {
        font-size: 20px;
        font-weight: 600;
        margin-right: 12px;
      }
      .topo-aba {
        padding: 8px 2px 10px;
        color: var(--text-secondary-color);
      }
      .topo-aba.ativa {
        color: var(--text-primary-color);
        font-weight: 600;
        box-shadow: inset 0 -2px 0 var(--focus-border-color);
      }
      .kanban-board {
        padding: 16px;
      }
      .kanban-board-content {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .kanban-board-column {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px;
        border-radius: 6px;
        background: var(--fundo-coluna);
      }
      .coluna-titulo {
        font-weight: 600;
        padding: 2px 4px 4px;
        display: flex;
        gap: 8px;
      }
      .coluna-contagem {
        color: var(--text-secondary-color);
        font-weight: normal;
      }

      /* Card (estrutura real: .wit-card > .card-flag + .card-content) */
      .wit-card {
        display: flex;
        position: relative;
        background: var(--fundo-card);
        border-radius: 4px;
        box-shadow: var(--sombra-card);
        font-size: 12px;
        line-height: 16px;
        overflow: hidden;
      }
      .card-flag {
        flex: 0 0 4px;
      }
      .card-content {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px 10px 10px 8px;
      }
      .nativo-cabecalho {
        display: flex;
        align-items: flex-start;
        gap: 6px;
      }
      .nativo-icone {
        flex: 0 0 10px;
        height: 12px;
        margin-top: 2px;
        border-radius: 2px;
      }
      .nativo-id {
        font-weight: 600;
      }
      .title {
        color: inherit;
        text-decoration: none;
        font-size: 13px;
        line-height: 16px;
      }
      .nativo-estado,
      .nativo-pessoa,
      .nativo-campo {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--text-secondary-color);
      }
      .nativo-bolinha {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .nativo-pessoa img,
      .nativo-iniciais {
        width: 20px;
        height: 20px;
        border-radius: 50%;
      }
      .nativo-iniciais {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        font-weight: 600;
        color: var(--text-primary-color);
        background: var(--tag);
      }
      .nativo-sem-pessoa .nativo-iniciais {
        border: 1px dashed var(--text-secondary-color);
        background: transparent;
      }
      .nativo-rotulo {
        min-width: 44px;
      }
      .nativo-tags {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .nativo-tag {
        padding: 0 8px;
        border-radius: 10px;
        background: var(--tag);
        font-size: 11px;
        line-height: 18px;
      }

      /* Taskboard */
      table.taskboard {
        margin: 16px;
        width: calc(100% - 32px);
        border-collapse: collapse;
        table-layout: fixed;
      }
      table.taskboard th {
        text-align: left;
        font-weight: 600;
        padding: 8px 10px;
        border-bottom: 1px solid var(--linha-tabela);
      }
      table.taskboard td {
        vertical-align: top;
        padding: 10px;
        border-right: 1px solid var(--linha-tabela);
      }
      table.taskboard td > .wit-card + .wit-card {
        margin-top: 10px;
      }
      .taskboard-parent-cell {
        background: var(--fundo-coluna);
      }

      /* Card sozinho (close-up) */
      body.cena-card {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--fundo-coluna);
      }
      .sozinho {
        width: 300px;
        zoom: 2;
      }
    </style>
  </head>
  <body>
    <div id="raiz"></div>
    <script src="demo.js"></script>
  </body>
</html>
