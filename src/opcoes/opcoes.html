<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Predecessores no card</title>
    <style>
      :root {
        color-scheme: light dark;
        --texto: #1f1f1f;
        --texto-secundario: #5f5f5f;
        --fundo: #ffffff;
        --borda: #d6d6d6;
        --destaque: #0f6cbd;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --texto: #f0f0f0;
          --texto-secundario: #b0b0b0;
          --fundo: #1f1f1f;
          --borda: #444444;
          --destaque: #4ba0f0;
        }
      }
      body {
        margin: 0;
        padding: 16px 20px;
        min-width: 360px;
        font: 14px/1.4 'Segoe UI', system-ui, sans-serif;
        color: var(--texto);
        background: var(--fundo);
      }
      h1 {
        font-size: 16px;
        margin: 0 0 12px;
      }
      fieldset {
        border: 1px solid var(--borda);
        border-radius: 6px;
        margin: 0 0 12px;
        padding: 8px 12px 10px;
      }
      legend {
        padding: 0 4px;
        color: var(--texto-secundario);
        font-size: 12px;
      }
      label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 0;
      }
      label.caixa {
        justify-content: flex-start;
      }
      input[type='number'] {
        width: 72px;
        font: inherit;
        padding: 2px 6px;
        color: var(--texto);
        background: var(--fundo);
        border: 1px solid var(--borda);
        border-radius: 4px;
      }
      input[type='checkbox'] {
        accent-color: var(--destaque);
        width: 16px;
        height: 16px;
        margin: 0;
      }
      .rodape {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      button {
        font: inherit;
        padding: 4px 14px;
        border: 1px solid var(--borda);
        border-radius: 4px;
        background: transparent;
        color: var(--texto);
        cursor: pointer;
      }
      #status {
        color: var(--texto-secundario);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Predecessores no card</h1>
    <form id="form">
      <fieldset>
        <legend>Onde mostrar</legend>
        <label class="caixa"><input type="checkbox" name="ligarNoBoard" /> Ligar no board</label>
        <label class="caixa"><input type="checkbox" name="ligarNoTaskboard" /> Ligar no taskboard</label>
        <label class="caixa"
          ><input type="checkbox" name="esconderEmCardConcluido" /> Esconder em card concluído</label
        >
      </fieldset>
      <fieldset>
        <legend>Linhas e links</legend>
        <label>Máximo de linhas por card <input type="number" name="maxLinhas" min="1" max="20" step="1" /></label>
        <label class="caixa"><input type="checkbox" name="abrirEmNovaAba" /> Abrir o predecessor em nova aba</label>
      </fieldset>
      <fieldset>
        <legend>Cache</legend>
        <label>Validade do cache (s) <input type="number" name="validadeDoCacheSeg" min="5" max="3600" step="1" /></label>
      </fieldset>
      <div class="rodape">
        <button type="button" id="padrao">Restaurar padrão</button>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
    </form>
    <script src="opcoes.js"></script>
  </body>
</html>
